# Config-as-code for the Shopify Dev Dashboard custom app this project
# connects to via OAuth (see src/lib/platforms/shopify.ts and
# app/api/oauth/shopify/*). This app is headless/backend-only — it has
# no embedded admin UI, so there are no extensions and `embedded = false`.
#
# [webhooks] below has no [[webhooks.subscriptions]] inside it, on
# purpose: Shopify has no webhook topic for blog articles at all, on
# any API surface — the WebhookSubscriptionTopic GraphQL enum (which
# `shopify app deploy` validates against) has no ARTICLES_*/BLOGS_*
# entry, and the classic REST webhooks endpoint rejects
# articles/create + articles/update outright too (confirmed directly
# against both). So this app's ingestion pipeline polls instead —
# app/api/cron/poll-shopify-articles, once daily per vercel.json —
# there's no subscription to declare here or register anywhere.
# `[webhooks]` itself (just `api_version`) is still required by the
# schema even with no subscriptions in it — omitting the table
# entirely fails deploy with "[webhooks]: Required."
#
# See docs/PHASE_0_PLAN.md for the rest of the architecture.

name = "VGF Content Distribution"
client_id = "9477fb4fb3c352728f8f5293167c3b77"
application_url = "https://vgf-content-platform.vercel.app"
embedded = false

[access_scopes]
# Read-only — this app only ever reads blog articles, never writes to
# the store. Matches SHOPIFY_SCOPES in src/lib/platforms/shopify.ts.
scopes = "read_content"

[auth]
redirect_urls = ["https://vgf-content-platform.vercel.app/api/oauth/shopify/callback"]

[webhooks]
api_version = "2026-04"
