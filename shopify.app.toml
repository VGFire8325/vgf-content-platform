# Config-as-code for the Shopify Dev Dashboard custom app this project
# connects to via OAuth (see src/lib/platforms/shopify.ts and
# app/api/oauth/shopify/*). This app is headless/backend-only — it has
# no embedded admin UI, so there are no extensions and `embedded = false`.
#
# [webhooks] below has no [[webhooks.subscriptions]] inside it, on
# purpose: the WebhookSubscriptionTopic GraphQL enum (which
# `shopify app deploy` validates against — this is the App Management
# API, GraphQL-native) has no ARTICLES_* or BLOGS_* topic at all. Blog
# article change events have no GraphQL-declarable webhook topic as of
# this API version, so the articles/create + articles/update
# subscription this app's ingestion pipeline needs
# (app/api/webhooks/shopify/articles) has to be registered a different
# way — see README.md "What has to exist before this runs against real
# data" for the current path. `[webhooks]` itself (just `api_version`)
# is still required by the schema even with no subscriptions in it —
# omitting the table entirely fails deploy with "[webhooks]: Required."
#
# See docs/PHASE_0_PLAN.md for the rest of the architecture.

name = "VGF Content Distribution"
client_id = "9477fb4fb3c352728f8f5293167c3b77"
application_url = "https://vgf-content-platform.vercel.app"
embedded = false

[access_scopes]
# Read-only — this app only ever reads blog articles, never writes to
# the store. Matches SHOPIFY_SCOPES in src/lib/platforms/shopify.ts.
scopes = "read_content"

[auth]
redirect_urls = ["https://vgf-content-platform.vercel.app/api/oauth/shopify/callback"]

[webhooks]
api_version = "2026-04"
